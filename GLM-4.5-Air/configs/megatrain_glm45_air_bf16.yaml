# GLM-4.5-Air text-only full fine-tuning template for MegaTrain.
# The sweep runner copies and rewrites this file for every profile/sequence.

model:
  name: "/mnt/data3/models/GLM-4.5-Air"
  dtype: "bfloat16"
  device: 0
  attn_implementation: "flash_attention_2"
  trust_remote_code: true

dataset:
  name: "fft_real_100"
  dataset_dir: "/mnt/data2/wbw/FFTtest/dataset"
  max_seq_len: 4096
  num_workers: 2

training:
  # MegaTrain treats batch_size as the global batch and splits it by device.
  batch_size: 8
  gradient_accumulation_steps: 1
  num_steps: 15
  learning_rate: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42

optimizer:
  type: "deepspeed_adam"
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

memory:
  checkpoint_interval: 4
  num_grad_slabs: 12

logging:
  log_interval: 1
  enable_timing: true
