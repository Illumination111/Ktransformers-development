# GLM-4.5-Air full fine-tuning benchmark template (native BF16).
#
# The server sweep copies this file for each sequence length and replaces all
# run-dependent values. Generated configs inside test_log are the source of
# truth for an individual measurement.

### model
model_name_or_path: /mnt/data3/models/GLM-4.5-Air
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full

### dataset
dataset: fft_real_100
dataset_dir: /mnt/data2/wbw/FFTtest/dataset
template: glm4_moe
cutoff_len: 4096
max_samples: 100
packing: false
overwrite_cache: false
preprocessing_num_workers: 16
dataloader_num_workers: 2
dataloader_prefetch_factor: 4
dataloader_persistent_workers: true
dataloader_pin_memory: true

### output
output_dir: /mnt/data2/wbw/FFTtest/GLM-4.5-Air/test_log/PLACEHOLDER
logging_steps: 1
logging_strategy: "no"
disable_tqdm: true
save_strategy: "no"
plot_loss: false
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
max_steps: 15
num_train_epochs: 100.0
lr_scheduler_type: cosine
warmup_steps: 0
bf16: true
fp16: false
tf32: false
pure_bf16: true
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
ddp_timeout: 360000000
resume_from_checkpoint: null
max_grad_norm: 1.0

### KTransformers
use_kt: true
kt_weight_path: /mnt/data3/models/GLM-4.5-Air
