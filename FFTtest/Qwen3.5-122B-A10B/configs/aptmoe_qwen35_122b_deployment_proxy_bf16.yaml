# Contract reference for aptmoe_qwen35_122b_proxy_train.py.
# Shape and parameter totals are audited from model_path/config.json at runtime.

benchmark_class: deployment_proxy
target_model: Qwen3.5-122B-A10B-text
proxy_tag: qwen35_122b
proxy_architecture: qwen35_122b_component_isomorphic
weight_source: deterministic_random_initialization
checkpoint_compatible: false
model_quality_metrics_allowed: false
real_forward_backward_optimizer_update: true

model_path: /mnt/data2/models/Qwen3.5-122B-A10B
precision: bf16
text_only: true
finetuning_type: full
deployment_profile: server  # server (8 GPUs) or consumer (2 GPUs)
expected_config_contract:
  num_hidden_layers: 48
  num_experts: 256
  num_experts_per_tok: 8
  hidden_size: 3072
  moe_intermediate_size: 1024
  text_parameters: 122111526912
  routed_expert_bf16_bytes: 18874368

routing:
  formal_source: merged_exact_qwen35_122b_router_trace
  route_trace_root: /mnt/data2/wbw/Ktransformers-development/FFTtest/APTMoE-simulate/routes/qwen35_122b
  synthetic_requires_explicit_flag: true
placement:
  formal_lookup_class: aptmoe_qwen35_122b_proxy_lookup
  lookup_root: /mnt/data2/wbw/Ktransformers-development/FFTtest/APTMoE-simulate/lookups/qwen35_122b
  unprofiled_requires_explicit_flag: true

execution:
  pipeline: APTMoE
  num_chunks: 1
  num_stages: 48
  layers_per_stage: 1
  inter_stage_only: true
  token_mixer_device: cuda
  require_linear_attention_fastpath: true
  router_device: cuda
  shared_expert_device: cuda
  routed_expert_home_device: cpu
  routed_expert_transfer_granularity: expert
  optimizer_home_device: cpu
  prefetch_portion: 0.6  # used only by explicitly marked smoke runs

smoke_guard:
  result_validity: smoke_only
  result_marker: SMOKE_ONLY
  formal_claim_allowed: false

protocol:
  profile: server
  num_gpus: 8
  global_batch_size: 8
  per_device_batch_size: 1
  steps: 15
  timing_warmup_steps: 5
  gradient_accumulation_steps: 1
  cpu_threads_per_rank: 12
  sequence_lengths: [32, 64, 128, 256, 512, 1024, 2048, 4096]
  timing_mode: coarse_host_wall_no_cuda_sync
  emit_run_config: true
  emit_step_timing: true
  emit_memory_summary: true
  emit_proxy_manifest: true
  emit_full_update_verification: true
